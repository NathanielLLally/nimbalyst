# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user devel;
worker_processes auto;
error_log /home/devel/nginx_error.log notice;
pid /run/nginx.pid;
# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
#include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

#include /etc/nginx/conf.d/*.conf;



http {
    server_names_hash_bucket_size 64;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /home/devel/nginx_access.log  main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;


    # Define how to handle the Connection header based on the client's Upgrade request
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

	#  redirect http to https
	#
    server {
        listen       80;
        listen       [::]:80;
        server_name  _;
	location / {
		return 301 https://$host$request_uri;
	}
    }

	
	upstream next {
		server	localhost:3000; 
	}
	upstream nextdev {
		server	localhost:3001; 
	}

# Settings for a TLS enabled server.

    server {
        listen       443 ssl;
        listen       [::]:443 ssl http2;
#  for v 1.25 and >  
#        listen       [::]:443 ssl;
#        http2        on;
        server_name  happytailspawcare.com www.happytailspawcare.com;
        root         /srv/production/www/;

    	access_log  /srv/production/nginx_access.log  main;
	error_log /srv/production/nginx_error.log notice;
	client_body_timeout 30s;

#
#certbot certonly -d db.grandstreet.group -d app.grandstreet.group -d mail.pipelinesend.com -d pipelinesend.com -d try.pipelinesend.com -d get.pipelinesend.com -d www.pipelinesend.com -d sentby.pipelinesend.com
#
#  certbot certificates
#
#  app.happytailspawcare.com www.happytailspawcare.com happytailspawcare.com mta-sts.happytailspawcare.com get.happytailspawcare.com
#
#  TODO set up cron
#
        ssl_certificate "/etc/letsencrypt/live/happytailspawcare.com/fullchain.pem";
        ssl_certificate_key "/etc/letsencrypt/live/happytailspawcare.com/privkey.pem";
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout  10m;
        ssl_ciphers PROFILE=SYSTEM;
        ssl_prefer_server_ciphers on;

	#  vhosts,enable/site
        include /etc/nginx/default.d/*.conf;

        error_page 404 /404.html;
        location = /404.html {
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        }
	error_page  405     =200 $uri;

	location = /.well-known/mta-sts.txt {
	}

	location / {
#		rewrite /mail/mail.obiseo.net(.*) /mailgraph.cgi$1  break;
		try_files $uri @proxy;
		proxy_redirect off;
		access_log on;
		expires max;
	}
	location @proxy {
		client_max_body_size 10M;
		proxy_request_buffering off;
		#  http 1.1 enforced , wss handshake requires upgrade
		#  
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;

		proxy_set_header Host $http_host;
		proxy_set_header X-Forwarded-Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_pass       http://next;
		proxy_read_timeout 30s;
		proxy_cache_bypass $http_upgrade;
	}
    }
    server {
        listen       443 ssl;
        listen       [::]:443 ssl http2;
#  for v 1.25 and >  
#        listen       [::]:443 ssl;
#        http2        on;
        server_name  try.happytailspawcare.com;
        root         /home/devel/www/;

	client_body_timeout 30s;

#
#certbot certonly -d db.grandstreet.group -d app.grandstreet.group -d mail.pipelinesend.com -d pipelinesend.com -d try.pipelinesend.com -d get.pipelinesend.com -d www.pipelinesend.com -d sentby.pipelinesend.com
#
#  certbot certificates
#
#  app.happytailspawcare.com www.happytailspawcare.com happytailspawcare.com mta-sts.happytailspawcare.com get.happytailspawcare.com
#
#  TODO set up cron
#
        ssl_certificate "/etc/letsencrypt/live/happytailspawcare.com/fullchain.pem";
        ssl_certificate_key "/etc/letsencrypt/live/happytailspawcare.com/privkey.pem";
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout  10m;
        ssl_ciphers PROFILE=SYSTEM;
        ssl_prefer_server_ciphers on;

	#  vhosts,enable/site
        include /etc/nginx/default.d/*.conf;

        error_page 404 /404.html;
        location = /404.html {
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        }
	error_page  405     =200 $uri;

	location = /.well-known/mta-sts.txt {
	}

	location / {
#		rewrite /mail/mail.obiseo.net(.*) /mailgraph.cgi$1  break;
		try_files $uri @proxy;
		proxy_redirect off;
		access_log on;
